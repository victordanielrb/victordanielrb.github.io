<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0a0a0b"/>
  <!-- G ring: open at the right, thick rounded stroke -->
  <path d="M32 12 A20 20 0 0 0 32 52 A20 20 0 0 0 52 32" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <!-- Horizontal bar extending inward from the ring's right side, upper third -->
  <rect x="27" y="22" width="25" height="10" rx="5" fill="#fff"/>
  <!-- Accent square, separated in the bottom-right gap -->
  <rect x="40" y="40" width="9" height="9" fill="#3366ff"/>
</svg>
